<!-- ============================================================
  index.html — Interface graphique principale
  Responsables : Marly + Sarah
  ============================================================
  Ce fichier contient TOUTES les pages de l'application.
  On ne recharge pas la page : on affiche/cache des sections
  selon l'état de l'utilisateur (connecté, admin, etc.)
  
  SECTIONS :
    #section-login     → formulaire de connexion
    #section-register  → formulaire d'inscription
    #section-dashboard → liste des labyrinthes de l'utilisateur
    #section-labyrinth → affichage + génération + résolution
    #section-admin     → interface administrateur
  
  Chaque section a la classe CSS "section".
  La classe "hidden" la cache (display: none dans style.css).
  C'est app.js qui appelle showSection('nom') pour naviguer.
  ============================================================ -->
